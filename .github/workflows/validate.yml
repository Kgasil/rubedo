name: Rubedo validation
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  rules-and-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: find assets extension mini research scripts tests -name '*.js' -print0 | xargs -0 -n1 node --check
      - run: node tests/mini.test.js && node tests/research.test.js && node tests/advanced.test.js && node tests/scenario.test.js
      - run: node scripts/reference_results.js --check
      - run: python3 tests/check_package.py
  browser:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install playwright==1.57.0
      - run: python -m playwright install --with-deps chromium
      - run: python tests/browser_smoke.py
